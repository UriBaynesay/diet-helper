services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # TEMPORARY: publicly bound (0.0.0.0) so the app is reachable via the
      # raw VPS IP before nginx exists. Once nginx (host-native, see
      # infra/CLAUDE.md) is the sole public entrypoint, revert this to
      # "127.0.0.1:3000:3000" and close 3000/tcp in ufw again — Docker's
      # own iptables rules bypass ufw for published ports, so the loopback
      # bind (not ufw alone) is what actually protects this once reverted.
      - "3000:3000"
    environment:
      # Every var from .env.example except DATABASE_URL, which must point
      # at the "postgres" service hostname in here (not localhost:5432,
      # which is what .env's host-side-dev value uses and which inside this
      # container would mean the app container itself, not Postgres).
      DATABASE_URL: postgresql://diet_helper:${POSTGRES_PASSWORD}@postgres:5432/diet_helper
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # Loopback-only, for the same reason as "app" above — plus this one
      # matters more: a database port reachable from the internet is a
      # classic real-world breach vector on its own, independent of
      # anything nginx or ufw does. The "app" service reaches this over
      # Docker's internal network by service name ("postgres:5432"), which
      # needs no published port at all — this port exists only so *you* can
      # psql in from the host for debugging.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: diet_helper
      POSTGRES_USER: diet_helper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18+'s image manages a version-named subdirectory under
      # /var/lib/postgresql itself (pg_ctlcluster-style layout) — mounting
      # the volume there, not at .../data, is what 18+ actually expects
      # (learned by hitting the image's own startup error).
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diet_helper -d diet_helper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
